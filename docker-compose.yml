services:
  db:
    image: mysql:8.0
    container_name: garela-db
    restart: always
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 1q2w3e
      MYSQL_DATABASE: garela_db
    volumes:
      - ./garela-backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./garela-backend/db/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p1q2w3e"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./garela-backend
      dockerfile: Dockerfile
    container_name: garela-backend
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - ./garela-backend/.env 
    environment:
      - DB_HOST=db
      - DB_PASSWORD=1q2w3e
    depends_on:
      db:
        condition: service_healthy

  ai:
    build:
      context: ./garela-backend
      dockerfile: Dockerfile.ai
    container_name: garela-ai
    restart: always
    ports:
      - "5001:5001"
    env_file:
      - ./garela-backend/.env
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./garela-frontend
      dockerfile: Dockerfile
    container_name: garela-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:5000
    depends_on:
      - backend

volumes:
  mysql_data: